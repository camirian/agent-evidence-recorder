[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-recorder"
version = "0.1.0"
description = "Public-safe synthetic flight recorder for autonomous coding runs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
agent-evidence-recorder = "agent_evidence_recorder.__main__:main"

[tool.setuptools]
packages = ["agent_evidence_recorder"]
